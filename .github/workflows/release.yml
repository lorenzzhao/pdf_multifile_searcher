# Builds the standalone programs and publishes a GitHub Release.
#
# - Push a tag "vX.Y.Z" (matching the version in pyproject.toml): build, test, publish.
# - Push to main that changes packaging files: build and test only (no release).
# - Publishing to PyPI happens only when the repository variable PUBLISH_TO_PYPI is
#   "true" and PyPI trusted publishing is set up (see docs/RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux AppImage and tar.gz
    runs-on: ubuntu-latest
    container: almalinux:8  # glibc 2.28, so the result runs on older distributions too
    steps:
      - name: Install git
        run: dnf -y -q install git
      - uses: actions/checkout@v4
      - name: Build and test
        run: bash packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*
          if-no-files-found: error

  windows:
    name: Windows installer and portable ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build and test
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  python:
    name: Python package (wheel and sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --quiet build twine
          python -m build --outdir release
          python -m twine check release/*
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?( |$)" { on = 1; next }
            /^## / && on { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Downloads

          | System | File |
          |---|---|
          | Windows 10/11 (64-bit), installer | \`pdf-multifile-searcher-${version}-windows-x64-setup.exe\` |
          | Windows 10/11 (64-bit), portable | \`pdf-multifile-searcher-${version}-windows-x64-portable.zip\` |
          | Linux (x86_64), single file | \`PDF_Multifile_Searcher-${version}-x86_64.AppImage\` |
          | Linux (x86_64), folder | \`pdf-multifile-searcher-${version}-linux-x86_64.tar.gz\` |
          | Any system with Python 3.11+ | \`pipx install pdf_multifile_searcher-${version}-py3-none-any.whl\` |

          The Windows programs are not code-signed, so Windows SmartScreen may show
          "Windows protected your PC". Choose **More info → Run anyway** to start them.
          On Linux, make the AppImage executable (\`chmod +x\`) and start it.

          Verify downloads with \`SHA256SUMS.txt\` or \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`.

          ## License and source code

          PDF Multifile Searcher is free software under the GNU Affero General Public
          License v3.0 or later and comes with absolutely no warranty. The complete source
          code of this release is the tag [${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME})
          (also attached below as "Source code"). Each download contains a \`licenses\`
          folder with the licenses and notices of all included third-party components.
          EOF
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PDF Multifile Searcher ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pdf-multifile-searcher/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
