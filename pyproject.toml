[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pdf-multifile-searcher"
version = "2.0.1"
description = "Search text in many PDF files at once and view the matches in place."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.6",
    "pypdfium2>=4.30",
    "platformdirs>=4.0",
]

[project.urls]
Source = "https://github.com/lorenzzhao/pdf_multifile_searcher"
License = "https://www.gnu.org/licenses/agpl-3.0.html"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
pdf-multifile-search = "pdf_multifile_searcher.cli:main"

[project.gui-scripts]
pdf-multifile-searcher = "pdf_multifile_searcher.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_multifile_searcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# QModelIndex() as a default argument is the Qt idiom for "no parent".
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]

[tool.ruff.lint.per-file-ignores]
"src/pdf_multifile_searcher/gui/icons.py" = ["E501"]  # SVG path data

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
files = ["src"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*"]
ignore_missing_imports = true
